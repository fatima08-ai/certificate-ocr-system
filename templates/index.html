<!DOCTYPE html>
<html>
<head>
    <title>Certificate OCR System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        td, th { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        #result { display: none; }
        pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Certificate OCR System</h1>
        <div id="dropZone" style="border: 2px dashed #999; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s;">
    <p id="dropText">Drag and drop a certificate here, or click to browse</p>
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" style="display:none;">
    <div id="previewContainer" style="margin-top: 16px;"></div>
</div>
<button type="button" id="extractBtn" style="margin-top: 16px;" disabled>Extract Data</button>

    <div id="errorMessage" style="display:none; color:#b00020; background:#fdecea; padding:12px; border-radius:4px; margin-top:16px;"></div>

    <div id="result">
        <h2>Extracted Fields</h2>
        <table id="fieldsTable"></table>
        <h3>Raw OCR Text</h3>
        <pre id="rawText"></pre>
    </div>

    <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const extractBtn = document.getElementById('extractBtn');
    const errorBox = document.getElementById('errorMessage');
    const resultBox = document.getElementById('result');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#4a90d9';
        dropZone.style.background = '#f0f7ff';
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#999';
        dropZone.style.background = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#999';
        dropZone.style.background = '';
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
            handleFile(fileInput.files[0]);
        }
    });

    function handleFile(file) {
        selectedFile = file;
        extractBtn.disabled = false;
        previewContainer.innerHTML = '';

        if (file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.maxWidth = '200px';
            img.style.maxHeight = '200px';
            img.style.borderRadius = '4px';
            previewContainer.appendChild(img);
        } else {
            previewContainer.textContent = `📄 ${file.name}`;
        }
    }

    extractBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        errorBox.style.display = 'none';
        resultBox.style.display = 'none';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const response = await fetch('/extract', { method: 'POST', body: formData });
            const data = await response.json();

            if (!response.ok) {
                errorBox.textContent = data.detail || 'Something went wrong. Please try again.';
                errorBox.style.display = 'block';
                return;
            }

            const table = document.getElementById('fieldsTable');
            table.innerHTML = '';
            for (const [key, value] of Object.entries(data.extracted_fields)) {
                table.innerHTML += `<tr><th>${key}</th><td>${value ?? 'Not found'}</td></tr>`;
            }
            document.getElementById('rawText').textContent = data.raw_text;
            resultBox.style.display = 'block';
        } catch (err) {
            errorBox.textContent = 'Could not connect to the server. Please check your connection and try again.';
            errorBox.style.display = 'block';
        }
    });
    </script>
</body>
</html>
