<!DOCTYPE html>
<html>
<head>
    <title>Certificate OCR System</title>
    <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    td, th { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    #result { display: none; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
    <h1>Certificate OCR System</h1>
        <div id="dropZone" style="border: 2px dashed #999; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s;">
    <p id="dropText">Drag and drop a certificate here, or click to browse</p>
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" style="display:none;">
    <div id="previewContainer" style="margin-top: 16px;"></div>
</div>
<button type="button" id="extractBtn" style="margin-top: 16px;" disabled>Extract Data</button>
<button type="button" id="exportBtn" style="margin-top: 16px;" disabled>Download as Excel</button>
<div id="loadingSpinner" style="display:none; text-align:center; margin-top:16px;">
    <div style="border: 4px solid #f0f0f0; border-top: 4px solid #4a90d9; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto;"></div>
    <p style="color:#666; margin-top:8px;">Processing certificate...</p>
</div>
    <div id="errorMessage" style="display:none; color:#b00020; background:#fdecea; padding:12px; border-radius:4px; margin-top:16px;"></div>

    <div id="result">
        <h2>Extracted Fields</h2>
        <p id="confidenceBadge" style="display:inline-block; padding: 4px 10px; border-radius: 4px; font-size: 14px; font-weight: bold;"></p>
        <table id="fieldsTable"></table>
        <h3>Raw OCR Text</h3>
        <pre id="rawText"></pre>
    </div>

    <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const extractBtn = document.getElementById('extractBtn');
    const errorBox = document.getElementById('errorMessage');
    const resultBox = document.getElementById('result');
    const exportBtn = document.getElementById('exportBtn');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#4a90d9';
        dropZone.style.background = '#f0f7ff';
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#999';
        dropZone.style.background = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#999';
        dropZone.style.background = '';
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
            handleFile(fileInput.files[0]);
        }
    });

    function handleFile(file) {
        selectedFile = file;
        extractBtn.disabled = false;
        exportBtn.disabled = false;
        previewContainer.innerHTML = '';

        if (file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.maxWidth = '200px';
            img.style.maxHeight = '200px';
            img.style.borderRadius = '4px';
            previewContainer.appendChild(img);
        } else {
            previewContainer.textContent = `📄 ${file.name}`;
        }
    }

    extractBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        errorBox.style.display = 'none';
        resultBox.style.display = 'none';
        document.getElementById('loadingSpinner').style.display = 'block';
        extractBtn.disabled = true;

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const response = await fetch('/extract', { method: 'POST', body: formData });
            const data = await response.json();

            document.getElementById('loadingSpinner').style.display = 'none';
            extractBtn.disabled = false;

            if (!response.ok) {
                errorBox.textContent = data.detail || 'Something went wrong. Please try again.';
                errorBox.style.display = 'block';
                return;
            }

            const badge = document.getElementById('confidenceBadge');
            const confidence = data.confidence;
            badge.textContent = `OCR Confidence: ${confidence}%`;
            if (confidence >= 75) {
                badge.style.background = '#e6f4ea';
                badge.style.color = '#1e7e34';
            } else if (confidence >= 50) {
                badge.style.background = '#fff8e1';
                badge.style.color = '#8a6d00';
            } else {
                badge.style.background = '#fdecea';
                badge.style.color = '#b00020';
            }

            const table = document.getElementById('fieldsTable');
            table.innerHTML = '';
            for (const [key, value] of Object.entries(data.extracted_fields)) {
                table.innerHTML += `<tr><th>${key}</th><td>${value ?? 'Not found'}</td></tr>`;
            }
            document.getElementById('rawText').textContent = data.raw_text;
            resultBox.style.display = 'block';
        } catch (err) {
            document.getElementById('loadingSpinner').style.display = 'none';
            extractBtn.disabled = false;
            errorBox.textContent = 'Could not connect to the server. Please check your connection and try again.';
            errorBox.style.display = 'block';
        }
    });
    exportBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append('file', selectedFile);

        const response = await fetch('/export', { method: 'POST', body: formData });

        if (!response.ok) {
            const data = await response.json();
            errorBox.textContent = data.detail || 'Export failed. Please try again.';
            errorBox.style.display = 'block';
            return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `extracted_${selectedFile.name}.xlsx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
    });
    </script>
</body>
</html>
